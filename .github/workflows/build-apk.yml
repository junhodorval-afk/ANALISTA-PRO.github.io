
name: Criar APK ANALISTA PRO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  criar-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do GitHub
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Preparar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar aplicativo Android
        shell: bash
        run: |
          mkdir -p appandroid/app/src/main/java/com/analistapro/app
          mkdir -p appandroid/app/src/main/res/drawable cp icon-192.png appandroid/app/src/main/res/drawable/launcher_icon.png

          cat > appandroid/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AnalistaPro"
          include ":app"
          EOF

          cat > appandroid/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > appandroid/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > appandroid/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.analistapro.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.analistapro.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > appandroid/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:label="ANALISTA PRO"
                  android:icon="@drawable/launcher_icon"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > appandroid/app/src/main/java/com/analistapro/app/MainActivity.java <<'EOF'
          package com.analistapro.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.webkit.WebResourceRequest;

          public class MainActivity extends Activity {

              private WebView web;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {

                          Uri uri = request.getUrl();

                          if ("junhodorval-afk.github.io".equals(uri.getHost())
                                  && uri.getPath() != null
                                  && uri.getPath().startsWith(
                                      "/ANALISTA-PRO.github.io/")) {
                              return false;
                          }

                          try {
                              startActivity(
                                  new Intent(Intent.ACTION_VIEW, uri)
                              );
                          } catch (Exception ignored) {}

                          return true;
                      }
                  });

                  web.loadUrl(
                      "https://junhodorval-afk.github.io/ANALISTA-PRO.github.io/"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Compilar APK
        run: |
          cd appandroid
          gradle --no-daemon :app:assembleDebug

      - name: Preparar arquivo APK
        run: |
          cp appandroid/app/build/outputs/apk/debug/app-debug.apk ANALISTA_PRO.apk

      - name: Publicar APK no GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f ANALISTA_PRO.apk

          if ! git diff --cached --quiet; then
            git commit -m "Publicar APK ANALISTA PRO"
            git push
          fi


      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ANALISTA_PRO_ANDROID
          path: ANALISTA_PRO.apk
